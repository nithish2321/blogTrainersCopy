<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div><p class="eyebrow">Blog API</p><h1>Rich Blog Library</h1></div>
            <div class="library-count"><strong id="total-count">0</strong><span>posts available</span></div>
        </div>
    </header>

    <main>
        <section class="filters">
            <div class="filter-grid">
                <label>Search <input id="search" placeholder="Search text..."></label>
                <label>Author <select id="author"><option value="">All authors</option></select></label>
                <label>Category <select id="category"><option value="">All categories</option></select></label>
                <label>Topic <select id="topic"><option value="">All topics</option></select></label>
                <label>Sort <select id="sort">
                    <option value="newest">Newest first</option>
                    <option value="popular">Most viewed</option>
                    <option value="liked">Most liked</option>
                    <option value="quick">Quick reads</option>
                </select></label>
            </div>
            <div class="filter-actions">
                <span id="active-summary">Showing all posts</span>
                <button class="button secondary" id="clear">Clear filters</button>
            </div>
        </section>

        <section class="results-bar">
            <h2 id="results-title">All posts</h2>
            <span id="result-count">0 results</span>
        </section>

        <section id="blog-container"><p class="empty-state">Loading data...</p></section>
        <div class="load-more-row"><button class="button hidden" id="load-more">Load more</button></div>
    </main>

    <script src="script.js">
  
    </script>
</body>
</html>
